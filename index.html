<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LearnWorld – Kids Educational Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<style>
/* ===== RESET & VARIABLES ===== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#FF6B6B;--primary-dark:#E84545;
  --secondary:#4ECDC4;--secondary-dark:#3BADA5;
  --accent:#FFE66D;--accent-dark:#F0C93A;
  --purple:#A855F7;--purple-dark:#7E22CE;
  --green:#10B981;--green-dark:#059669;
  --blue:#3B82F6;--blue-dark:#1D4ED8;
  --orange:#F97316;--orange-dark:#EA580C;
  --bg:#FFF9F0;--card:#FFFFFF;
  --text:#2D3748;--text-light:#718096;
  --shadow:0 8px 32px rgba(0,0,0,.12);
  --shadow-sm:0 4px 16px rgba(0,0,0,.08);
  --radius:20px;--radius-lg:28px;--radius-sm:12px;
  --font:'Nunito',sans-serif;--font-title:'Fredoka One',cursive;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;font-family:var(--font);border:none;outline:none;}
input{font-family:var(--font);outline:none;}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes float{0%,100%{transform:translateY(0)rotate(-2deg)}50%{transform:translateY(-8px)rotate(2deg)}}
@keyframes confetti{0%{transform:translateY(-20px)rotate(0);opacity:1}100%{transform:translateY(100vh)rotate(720deg);opacity:0}}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes carMove{from{left:5%}to{left:80%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes starBurst{0%{transform:scale(0)rotate(0);opacity:1}100%{transform:scale(2)rotate(180deg);opacity:0}}
@keyframes planeAnim{0%{transform:translateX(-100px)translateY(20px)}50%{transform:translateX(50vw)translateY(-20px)}100%{transform:translateX(110vw)translateY(10px)}}

/* ===== SCREEN SYSTEM ===== */
.screen{display:none;min-height:100vh;animation:fadeIn .4s ease;}
.screen.active{display:flex;flex-direction:column;}

/* ===== LOGIN SCREEN ===== */
#screen-login{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);align-items:center;justify-content:center;padding:20px;}
.login-card{background:white;border-radius:var(--radius-lg);padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.login-logo{text-align:center;margin-bottom:30px;}
.login-logo .logo-icon{font-size:60px;animation:bounce 2s infinite;}
.login-logo h1{font-family:var(--font-title);font-size:32px;color:var(--primary);margin-top:10px;}
.login-logo p{color:var(--text-light);font-size:14px;margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px;}
.form-group input{width:100%;padding:14px 18px;border:2.5px solid #E2E8F0;border-radius:var(--radius-sm);font-size:15px;transition:border-color .2s;background:#F7FAFC;}
.form-group input:focus{border-color:var(--primary);}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,var(--primary),var(--orange));color:white;border-radius:var(--radius-sm);font-size:16px;font-weight:800;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 15px rgba(255,107,107,.4);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,107,.5);}
.btn-primary:active{transform:translateY(0);}
.login-divider{text-align:center;color:var(--text-light);font-size:13px;margin:12px 0;}
.btn-guest{width:100%;padding:14px;background:#F7FAFC;color:var(--text);border-radius:var(--radius-sm);font-size:15px;font-weight:700;border:2px dashed #CBD5E0;}
.btn-guest:hover{background:#EDF2F7;}

/* ===== ONBOARDING ===== */
#screen-onboard{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);align-items:center;justify-content:center;padding:20px;}
.onboard-card{background:white;border-radius:var(--radius-lg);padding:40px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.teacher-char{text-align:center;margin-bottom:20px;}
.teacher-char .teacher-emoji{font-size:80px;animation:bounce 2s infinite;}
.teacher-bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-radius:var(--radius);padding:16px 20px;font-size:16px;font-weight:700;text-align:center;margin-bottom:24px;position:relative;}
.teacher-bubble::before{content:'▲';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);color:#667eea;font-size:22px;}
.ob-title{font-family:var(--font-title);font-size:22px;color:var(--text);margin-bottom:16px;text-align:center;}
.ob-options{display:grid;gap:10px;}
.ob-options.grid2{grid-template-columns:1fr 1fr;}
.ob-options.grid3{grid-template-columns:1fr 1fr 1fr;}
.ob-option{padding:14px;border:3px solid #E2E8F0;border-radius:var(--radius-sm);font-size:15px;font-weight:700;background:white;transition:all .2s;text-align:center;}
.ob-option:hover,.ob-option.selected{border-color:var(--primary);background:#FFF0F0;color:var(--primary);}
.ob-option .ob-icon{font-size:28px;display:block;margin-bottom:4px;}
.ob-progress{display:flex;gap:8px;margin-bottom:24px;justify-content:center;}
.ob-dot{width:10px;height:10px;border-radius:50%;background:#E2E8F0;transition:background .3s;}
.ob-dot.active{background:var(--primary);}
.btn-next{width:100%;padding:16px;background:linear-gradient(135deg,var(--primary),var(--orange));color:white;border-radius:var(--radius-sm);font-size:16px;font-weight:800;margin-top:16px;transition:transform .2s;box-shadow:0 4px 15px rgba(255,107,107,.4);}
.btn-next:hover{transform:translateY(-2px);}

/* ===== MAIN APP SHELL ===== */
#screen-app{background:var(--bg);flex-direction:column;min-height:100vh;}
.app-header{background:white;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-pet{font-size:32px;cursor:pointer;transition:transform .2s;}
.header-pet:hover{transform:scale(1.1);}
.header-info .user-name{font-weight:800;font-size:15px;color:var(--text);}
.header-info .user-level{font-size:12px;color:var(--text-light);font-weight:600;}
.header-coins{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFE66D,#F0C93A);padding:8px 14px;border-radius:50px;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(240,201,58,.4);}
.header-coins span{font-size:20px;}
.bottom-nav{background:white;display:flex;border-top:2px solid #F0F0F0;position:fixed;bottom:0;left:0;right:0;z-index:100;}
.nav-btn{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--text-light);background:transparent;transition:color .2s;border-top:3px solid transparent;}
.nav-btn .nav-icon{font-size:22px;}
.nav-btn.active{color:var(--primary);border-top-color:var(--primary);}
.app-content{flex:1;overflow-y:auto;padding:20px 16px 90px;}

/* ===== HOME TAB ===== */
.home-welcome{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--radius-lg);padding:24px;color:white;margin-bottom:20px;position:relative;overflow:hidden;}
.home-welcome::after{content:'🌟';position:absolute;right:20px;top:-10px;font-size:80px;opacity:.3;animation:float 3s infinite;}
.home-welcome h2{font-family:var(--font-title);font-size:26px;margin-bottom:4px;}
.home-welcome p{opacity:.9;font-size:14px;}
.xp-bar-wrap{margin-top:12px;background:rgba(255,255,255,.3);border-radius:50px;height:10px;}
.xp-bar{height:100%;border-radius:50px;background:var(--accent);transition:width .5s;}
.xp-label{font-size:12px;margin-top:4px;opacity:.9;}
.section-title{font-family:var(--font-title);font-size:20px;color:var(--text);margin-bottom:12px;}
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.subject-card{background:white;border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .2s,box-shadow .2s;border:3px solid transparent;position:relative;overflow:hidden;}
.subject-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;border-radius:0 0 var(--radius) var(--radius);}
.subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.subject-card .card-icon{font-size:40px;margin-bottom:8px;display:block;}
.subject-card .card-title{font-weight:800;font-size:14px;color:var(--text);}
.subject-card .card-sub{font-size:11px;color:var(--text-light);margin-top:2px;}
.subject-card.color-red::after{background:var(--primary);}
.subject-card.color-blue::after{background:var(--blue);}
.subject-card.color-green::after{background:var(--green);}
.subject-card.color-purple::after{background:var(--purple);}
.subject-card.color-orange::after{background:var(--orange);}
.subject-card.color-teal::after{background:var(--secondary);}
.medals-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.medal-badge{background:white;border-radius:var(--radius-sm);padding:12px 16px;text-align:center;min-width:80px;box-shadow:var(--shadow-sm);flex-shrink:0;}
.medal-badge .medal-icon{font-size:28px;}
.medal-badge .medal-name{font-size:10px;font-weight:700;color:var(--text-light);margin-top:2px;}
.streak-card{background:linear-gradient(135deg,#FF6B6B,#FF8E53);border-radius:var(--radius);padding:16px 20px;color:white;display:flex;align-items:center;gap:16px;margin-bottom:20px;box-shadow:0 4px 20px rgba(255,107,107,.3);}
.streak-card .streak-num{font-family:var(--font-title);font-size:48px;}
.streak-card .streak-text h3{font-weight:800;font-size:16px;}
.streak-card .streak-text p{font-size:13px;opacity:.9;}

/* ===== CHARACTER / PET SCREEN ===== */
.pet-stage{background:linear-gradient(180deg,#87CEEB 0%,#98D8C8 60%,#90EE90 100%);border-radius:var(--radius-lg);margin-bottom:20px;padding:30px;display:flex;flex-direction:column;align-items:center;min-height:280px;position:relative;overflow:hidden;}
.pet-stage::before{content:'☀️';position:absolute;top:16px;right:24px;font-size:40px;animation:pulse 3s infinite;}
.pet-display{position:relative;display:inline-block;margin-bottom:12px;}
.pet-body{font-size:100px;line-height:1;display:block;animation:bounce 3s infinite;filter:drop-shadow(0 10px 20px rgba(0,0,0,.2));}
.pet-accessory-hat{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:40px;}
.pet-accessory-glasses{position:absolute;top:25px;left:50%;transform:translateX(-50%);font-size:30px;}
.pet-accessory-clothes{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:36px;}
.pet-name{font-family:var(--font-title);font-size:22px;color:white;text-shadow:0 2px 8px rgba(0,0,0,.3);}
.pet-selector{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;margin-bottom:16px;}
.pet-option{background:white;border-radius:var(--radius-sm);padding:10px 14px;text-align:center;cursor:pointer;border:3px solid transparent;transition:all .2s;flex-shrink:0;}
.pet-option.selected{border-color:var(--primary);background:#FFF0F0;}
.pet-option .po-emoji{font-size:32px;display:block;}
.pet-option .po-name{font-size:10px;font-weight:700;color:var(--text-light);margin-top:2px;}
.customize-section{background:white;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.customize-section h3{font-weight:800;font-size:15px;margin-bottom:12px;color:var(--text);}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;}
.acc-item{background:#F7FAFC;border-radius:var(--radius-sm);padding:8px;text-align:center;cursor:pointer;border:2.5px solid transparent;transition:all .2s;}
.acc-item:hover,.acc-item.selected{border-color:var(--primary);background:#FFF0F0;}
.acc-item .acc-icon{font-size:26px;}
.acc-item .acc-price{font-size:9px;font-weight:700;color:var(--text-light);}
.acc-item.locked{opacity:.5;cursor:not-allowed;}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.color-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .2s;}
.color-swatch.selected,.color-swatch:hover{border-color:var(--text);transform:scale(1.15);}

/* ===== VOCAB SCREEN ===== */
.vocab-hero{background:linear-gradient(135deg,#4ECDC4,#44A08D);border-radius:var(--radius-lg);padding:24px;color:white;margin-bottom:20px;text-align:center;}
.vocab-hero h2{font-family:var(--font-title);font-size:26px;}
.vocab-hero p{opacity:.9;font-size:14px;margin-top:4px;}
.level-tabs{display:flex;gap:8px;margin-bottom:20px;background:white;padding:6px;border-radius:50px;box-shadow:var(--shadow-sm);}
.level-tab{flex:1;padding:10px;border-radius:50px;font-size:13px;font-weight:700;background:transparent;color:var(--text-light);transition:all .2s;}
.level-tab.active{background:var(--primary);color:white;box-shadow:0 2px 10px rgba(255,107,107,.4);}
.category-list{display:flex;flex-direction:column;gap:12px;}
.category-card{background:white;border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .2s,box-shadow .2s;border-left:5px solid var(--primary);}
.category-card:hover{transform:translateX(4px);box-shadow:var(--shadow);}
.category-card .cat-icon{font-size:36px;flex-shrink:0;}
.category-card .cat-info{flex:1;}
.category-card .cat-name{font-weight:800;font-size:15px;color:var(--text);}
.category-card .cat-sub{font-size:12px;color:var(--text-light);margin-top:2px;}
.cat-progress{height:6px;background:#EDF2F7;border-radius:50px;margin-top:6px;}
.cat-progress-fill{height:100%;border-radius:50px;background:var(--green);transition:width .5s;}
.category-card .cat-arrow{font-size:20px;color:var(--text-light);}

/* ===== FLASHCARD ===== */
.flashcard-screen{padding:20px;display:flex;flex-direction:column;min-height:calc(100vh - 140px);}
.fc-progress{background:white;border-radius:50px;height:10px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
.fc-progress-bar{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--primary),var(--orange));transition:width .5s;}
.flashcard-container{perspective:1000px;flex:1;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.flashcard{width:100%;max-width:380px;height:280px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.175,.885,.32,1.275);cursor:pointer;}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-shadow:var(--shadow);}
.fc-front{background:white;border:3px solid #F0F0F0;}
.fc-back{background:linear-gradient(135deg,#667eea,#764ba2);color:white;transform:rotateY(180deg);}
.fc-word-emoji{font-size:72px;margin-bottom:12px;animation:float 3s infinite;}
.fc-word{font-family:var(--font-title);font-size:36px;color:var(--text);}
.fc-hint{font-size:13px;color:var(--text-light);margin-top:8px;}
.fc-meaning{font-family:var(--font-title);font-size:30px;color:white;}
.fc-english{font-size:22px;opacity:.9;margin-top:6px;}
.fc-example{font-size:13px;opacity:.8;margin-top:8px;text-align:center;}
.speak-btn{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);color:white;padding:8px 16px;border-radius:50px;font-size:13px;font-weight:700;margin-top:12px;display:flex;align-items:center;gap:6px;}
.speak-btn:hover{background:rgba(255,255,255,.3);}
.fc-controls{display:flex;gap:12px;justify-content:center;align-items:center;}
.fc-btn{padding:14px 28px;border-radius:50px;font-size:15px;font-weight:800;transition:transform .2s,box-shadow .2s;}
.fc-btn:hover{transform:translateY(-2px);}
.fc-btn-prev{background:#F0F0F0;color:var(--text);}
.fc-btn-next{background:linear-gradient(135deg,var(--primary),var(--orange));color:white;box-shadow:0 4px 15px rgba(255,107,107,.4);}
.fc-btn-quiz{background:linear-gradient(135deg,var(--purple),#7C3AED);color:white;padding:14px 32px;border-radius:50px;font-size:16px;font-weight:800;box-shadow:0 4px 15px rgba(168,85,247,.4);}
.fc-counter{font-weight:800;font-size:15px;color:var(--text-light);}

/* ===== QUIZ ===== */
.quiz-header{background:white;padding:16px 20px;border-bottom:2px solid #F0F0F0;}
.quiz-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.quiz-score{font-weight:800;font-size:14px;color:var(--text);}
.quiz-type-badge{background:var(--primary);color:white;padding:4px 12px;border-radius:50px;font-size:12px;font-weight:700;}
.quiz-body{padding:20px;flex:1;}
.quiz-question-card{background:white;border-radius:var(--radius-lg);padding:28px;text-align:center;margin-bottom:20px;box-shadow:var(--shadow-sm);}
.quiz-question-emoji{font-size:72px;margin-bottom:12px;display:block;}
.quiz-question-text{font-family:var(--font-title);font-size:24px;color:var(--text);}
.quiz-question-sub{font-size:13px;color:var(--text-light);margin-top:6px;}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.quiz-option{background:white;border:3px solid #E2E8F0;border-radius:var(--radius-sm);padding:16px 12px;font-size:14px;font-weight:700;color:var(--text);transition:all .2s;text-align:center;}
.quiz-option:hover:not(:disabled){border-color:var(--primary);background:#FFF0F0;}
.quiz-option.correct{border-color:var(--green);background:#ECFDF5;color:var(--green-dark);}
.quiz-option.wrong{border-color:var(--primary);background:#FFF5F5;color:var(--primary-dark);animation:shake .4s;}
.quiz-option:disabled{cursor:default;}
.quiz-feedback{padding:16px 20px;border-radius:var(--radius);margin-bottom:16px;font-weight:700;font-size:15px;text-align:center;display:none;}
.quiz-feedback.show{display:block;animation:popIn .3s ease;}
.quiz-feedback.correct{background:#ECFDF5;color:var(--green-dark);}
.quiz-feedback.wrong{background:#FFF5F5;color:var(--primary-dark);}
.quiz-input{width:100%;padding:16px 20px;border:3px solid #E2E8F0;border-radius:var(--radius-sm);font-size:18px;font-weight:700;text-align:center;background:white;box-shadow:var(--shadow-sm);}
.quiz-input:focus{border-color:var(--primary);}
.quiz-submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--primary),var(--orange));color:white;border-radius:var(--radius-sm);font-size:16px;font-weight:800;margin-top:10px;box-shadow:0 4px 15px rgba(255,107,107,.4);}
.matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.match-item{background:white;border:3px solid #E2E8F0;border-radius:var(--radius-sm);padding:14px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;transition:all .2s;min-height:70px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;}
.match-item:hover{border-color:var(--secondary);}
.match-item.selected{border-color:var(--primary);background:#FFF0F0;}
.match-item.matched{border-color:var(--green);background:#ECFDF5;cursor:default;}
.match-item.wrong-match{border-color:var(--primary);background:#FFF5F5;animation:shake .3s;}
.match-item .match-emoji{font-size:28px;}

/* CAR GAME */
.car-game{background:white;border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:20px;}
.car-road{background:linear-gradient(90deg,#4A5568,#2D3748);border-radius:var(--radius);height:80px;position:relative;overflow:hidden;margin-bottom:20px;}
.car-road::before{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#FFD700 0,#FFD700 30px,transparent 30px,transparent 60px);animation:carMove 2s linear infinite;}
.car-emoji{position:absolute;top:50%;transform:translateY(-50%);font-size:36px;transition:left .5s;z-index:2;}
.car-finish{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:30px;}
.car-progress-text{font-weight:800;font-size:14px;color:var(--text);text-align:center;margin-bottom:12px;}
.car-question{background:#F7FAFC;border-radius:var(--radius-sm);padding:16px;text-align:center;margin-bottom:14px;}
.car-question .cq-emoji{font-size:48px;}
.car-question .cq-word{font-family:var(--font-title);font-size:24px;color:var(--text);margin-top:6px;}

/* QUIZ RESULT */
.quiz-result{text-align:center;padding:30px 20px;}
.result-medal{font-size:80px;animation:popIn .5s ease;display:block;margin-bottom:12px;}
.result-title{font-family:var(--font-title);font-size:32px;color:var(--text);margin-bottom:8px;}
.result-score{font-size:18px;color:var(--text-light);margin-bottom:20px;}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
.result-stat{background:white;border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow-sm);text-align:center;}
.result-stat .rs-num{font-family:var(--font-title);font-size:28px;color:var(--primary);}
.result-stat .rs-label{font-size:11px;color:var(--text-light);font-weight:700;}
.result-btns{display:flex;gap:12px;flex-direction:column;}
.btn-retry{background:linear-gradient(135deg,var(--orange),#F97316);color:white;padding:16px;border-radius:var(--radius-sm);font-size:16px;font-weight:800;box-shadow:0 4px 15px rgba(249,115,22,.4);}
.btn-retry-wrong{background:linear-gradient(135deg,var(--purple),#7C3AED);color:white;padding:16px;border-radius:var(--radius-sm);font-size:16px;font-weight:800;box-shadow:0 4px 15px rgba(168,85,247,.4);}
.btn-home-result{background:white;color:var(--text);padding:14px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;border:2px solid #E2E8F0;}
.wrong-answers-list{background:white;border-radius:var(--radius);padding:16px;text-align:left;margin-bottom:20px;box-shadow:var(--shadow-sm);}
.wrong-answers-list h3{font-weight:800;font-size:14px;color:var(--text);margin-bottom:10px;}
.wrong-answer-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:13px;}
.wrong-answer-item:last-child{border-bottom:none;}

/* ===== FLAG LEARNING ===== */
.world-map-container{background:white;border-radius:var(--radius-lg);padding:16px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
.continent-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;}
.cont-tab{padding:8px 16px;border-radius:50px;font-size:12px;font-weight:700;background:#F7FAFC;color:var(--text-light);white-space:nowrap;transition:all .2s;border:2px solid transparent;}
.cont-tab.active{background:var(--primary);color:white;border-color:var(--primary-dark);}
.flags-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.flag-card{background:white;border-radius:var(--radius-sm);padding:14px;text-align:center;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;border:2px solid #F0F0F0;}
.flag-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.flag-card .flag-emoji{font-size:40px;display:block;margin-bottom:6px;}
.flag-card .flag-name{font-weight:700;font-size:12px;color:var(--text);}
.flag-card .flag-capital{font-size:10px;color:var(--text-light);margin-top:2px;}
.flag-card.studied{border-color:var(--green);}
.country-detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.country-detail-card{background:white;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:30px;width:100%;max-width:500px;animation:slideIn .3s ease;}
.cdc-flag{font-size:80px;text-align:center;margin-bottom:12px;}
.cdc-name{font-family:var(--font-title);font-size:28px;text-align:center;color:var(--text);}
.cdc-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
.cdc-info-item{background:#F7FAFC;border-radius:var(--radius-sm);padding:12px;text-align:center;}
.cdc-info-item .ci-label{font-size:11px;color:var(--text-light);font-weight:700;}
.cdc-info-item .ci-value{font-size:15px;font-weight:800;color:var(--text);margin-top:2px;}
.cdc-btns{display:flex;gap:10px;margin-top:16px;}
.cdc-speak{flex:1;padding:14px;background:linear-gradient(135deg,var(--secondary),var(--secondary-dark));color:white;border-radius:var(--radius-sm);font-size:14px;font-weight:800;}
.cdc-quiz{flex:1;padding:14px;background:linear-gradient(135deg,var(--primary),var(--orange));color:white;border-radius:var(--radius-sm);font-size:14px;font-weight:800;}
.cdc-close{position:absolute;top:16px;right:20px;font-size:24px;background:none;border:none;cursor:pointer;color:var(--text-light);}

/* ===== WORLD TOUR ===== */
.world-tour-hero{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);border-radius:var(--radius-lg);padding:30px;color:white;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;}
.wt-globe{font-size:80px;animation:spin 10s linear infinite;display:block;margin:0 auto 12px;}
.wt-title{font-family:var(--font-title);font-size:28px;margin-bottom:6px;}
.wt-sub{font-size:14px;opacity:.8;}
.wt-plane{font-size:40px;position:absolute;animation:planeAnim 6s ease-in-out infinite;top:50%;transform:translateY(-50%);}
.continent-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.continent-card{border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.continent-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.continent-card .cc-icon{font-size:48px;margin-bottom:8px;display:block;}
.continent-card .cc-name{font-family:var(--font-title);font-size:16px;color:white;}
.continent-card .cc-count{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;}
.continent-card .cc-progress{margin-top:8px;background:rgba(255,255,255,.3);border-radius:50px;height:6px;}
.continent-card .cc-progress-fill{height:100%;border-radius:50px;background:white;transition:width .5s;}
.continent-card.locked{filter:grayscale(.7);cursor:not-allowed;}
.continent-card.locked::after{content:'🔒';position:absolute;top:10px;right:10px;font-size:18px;}
.cc-asia{background:linear-gradient(135deg,#E07A5F,#C1440E);}
.cc-europe{background:linear-gradient(135deg,#3D405B,#191C33);}
.cc-americas{background:linear-gradient(135deg,#81B29A,#3D7A5A);}
.cc-africa{background:linear-gradient(135deg,#F2CC8F,#C8941A);}
.cc-oceania{background:linear-gradient(135deg,#5A78D1,#2A4BAA);}
.cc-middleeast{background:linear-gradient(135deg,#DAA0D5,#8B4A89);}

/* ===== SEARCH ===== */
.search-bar{background:white;border-radius:50px;padding:14px 20px;display:flex;align-items:center;gap:12px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
.search-bar input{flex:1;border:none;font-size:15px;background:transparent;color:var(--text);}
.search-bar .search-icon{font-size:20px;}
.search-results{display:flex;flex-direction:column;gap:10px;}
.search-result-item{background:white;border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .2s;}
.search-result-item:hover{transform:translateX(4px);}

/* ===== PROFILE TAB ===== */
.profile-hero{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--radius-lg);padding:28px;color:white;text-align:center;margin-bottom:20px;position:relative;}
.profile-pet{font-size:80px;margin-bottom:8px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3));animation:bounce 3s infinite;}
.profile-name{font-family:var(--font-title);font-size:28px;}
.profile-level{font-size:14px;opacity:.9;margin-top:4px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.stat-card{background:white;border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow-sm);}
.stat-card .sc-icon{font-size:32px;margin-bottom:6px;}
.stat-card .sc-value{font-family:var(--font-title);font-size:28px;color:var(--text);}
.stat-card .sc-label{font-size:12px;color:var(--text-light);font-weight:700;margin-top:2px;}
.achievements-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.achievement{background:white;border-radius:var(--radius-sm);padding:12px;text-align:center;box-shadow:var(--shadow-sm);}
.achievement .ach-icon{font-size:32px;margin-bottom:4px;}
.achievement .ach-name{font-size:10px;font-weight:700;color:var(--text-light);}
.achievement.locked{opacity:.4;filter:grayscale(1);}

/* ===== CONFETTI ===== */
.confetti-piece{position:fixed;width:10px;height:10px;top:-20px;border-radius:2px;animation:confetti 3s ease forwards;pointer-events:none;z-index:999;}

/* ===== OVERLAYS ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
.overlay-card{background:white;border-radius:var(--radius-lg);padding:30px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .3s ease;}
.overlay-card h2{font-family:var(--font-title);font-size:24px;color:var(--text);margin-bottom:12px;text-align:center;}
.overlay-card p{color:var(--text-light);font-size:14px;text-align:center;line-height:1.6;margin-bottom:20px;}

/* ===== MISC ===== */
.badge-new{background:var(--primary);color:white;font-size:9px;font-weight:800;padding:2px 6px;border-radius:50px;vertical-align:top;margin-left:4px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light);}
.empty-state .es-icon{font-size:60px;display:block;margin-bottom:12px;}
.empty-state p{font-size:15px;font-weight:600;}
.progress-ring{display:flex;align-items:center;gap:12px;background:white;border-radius:var(--radius-sm);padding:12px 16px;box-shadow:var(--shadow-sm);margin-bottom:12px;}
.pr-bar{flex:1;height:8px;background:#EDF2F7;border-radius:50px;}
.pr-bar-fill{height:100%;border-radius:50px;transition:width .5s;}
.pr-label{font-size:12px;font-weight:700;color:var(--text-light);min-width:36px;text-align:right;}

/* ===== RESPONSIVE ===== */
@media(max-width:400px){
  .quiz-options{grid-template-columns:1fr;}
  .subject-grid{grid-template-columns:1fr 1fr;}
}

/* ===== MATH TAB ===== */
.math-hero{background:linear-gradient(135deg,#FF922B,#FF6B6B);border-radius:var(--radius-lg);padding:24px;color:white;margin-bottom:16px;position:relative;overflow:hidden;}
.math-hero::after{content:'🧮';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:64px;opacity:.25;}
.math-hero h2{font-family:var(--font-title);font-size:26px;margin-bottom:4px;}
.math-hero p{opacity:.92;font-size:14px;}
.math-xp-wrap{margin-top:10px;background:rgba(255,255,255,.3);border-radius:50px;height:10px;}
.math-xp-bar{height:100%;border-radius:50px;background:var(--accent);transition:width .5s;}
.math-xp-label{font-size:12px;margin-top:4px;opacity:.9;}

/* Grade selector bar */
.grade-toggle-bar{display:flex;align-items:center;justify-content:space-between;background:white;border-radius:var(--radius-sm);padding:12px 16px;box-shadow:var(--shadow-sm);cursor:pointer;margin-bottom:8px;}
.grade-toggle-label{font-weight:800;font-size:14px;color:var(--text);}
.grade-toggle-val{font-weight:700;font-size:13px;color:var(--orange);flex:1;margin-left:8px;}
.grade-toggle-arrow{font-size:13px;color:var(--text-light);transition:transform .2s;}
.grade-toggle-bar.open .grade-toggle-arrow{transform:rotate(180deg);}

.grade-panel{display:none;background:white;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:12px;flex-direction:column;gap:12px;}
.grade-panel.open{display:flex;}
.grade-section-hd{font-size:11px;font-weight:900;color:var(--text-light);letter-spacing:.06em;margin-bottom:4px;}
.grade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.grade-opt-btn{font-family:var(--font);font-weight:700;font-size:12px;padding:10px 4px;border-radius:var(--radius-sm);border:2.5px solid transparent;cursor:pointer;text-align:center;line-height:1.4;transition:all .18s;}
.grade-opt-btn small{display:block;font-weight:400;font-size:10px;opacity:.8;margin-top:1px;}
.grade-opt-btn.g1{background:#E8F5E9;color:#2E7D32;}
.grade-opt-btn.g2{background:#E3F2FD;color:#1565C0;}
.grade-opt-btn.g3{background:#FFF3E0;color:#E65100;}
.grade-opt-btn.active{border-color:currentColor;transform:scale(1.05);}

/* Problem card */
.math-problem-card{background:white;border-radius:var(--radius-lg);padding:22px 20px;box-shadow:var(--shadow-sm);text-align:center;margin-bottom:12px;}
.math-op-badge{display:inline-block;font-family:var(--font-title);font-size:13px;padding:4px 14px;border-radius:50px;margin-bottom:10px;}
.math-op-add{background:#E8F5E9;color:#2E7D32;}
.math-op-sub{background:#FFF3E0;color:#E65100;}
.math-op-mul{background:#E3F2FD;color:#1565C0;}
.math-op-div{background:#F3E5F5;color:#6A1B9A;}
.math-problem-text{font-family:var(--font-title);font-size:clamp(32px,9vw,50px);color:var(--text);line-height:1.1;margin-bottom:8px;min-height:58px;display:flex;align-items:center;justify-content:center;}
.math-hint-text{font-size:13px;color:var(--text-light);min-height:18px;font-style:italic;}

/* Answer row */
.math-answer-row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px;}
.math-answer-input{flex:1;font-family:var(--font-title);font-size:28px;text-align:center;border:3px solid #E2E8F0;border-radius:var(--radius-sm);padding:12px 8px;outline:none;background:white;color:var(--text);transition:border-color .2s;-webkit-appearance:none;-moz-appearance:textfield;}
.math-answer-input:focus{border-color:var(--blue);}
.math-answer-input.correct{border-color:var(--green);background:#ECFDF5;}
.math-answer-input.wrong{border-color:var(--primary);background:#FFF5F5;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
.math-btn{font-family:var(--font);font-weight:800;font-size:15px;border:none;border-radius:var(--radius-sm);padding:13px 16px;cursor:pointer;transition:transform .1s;white-space:nowrap;}
.math-btn:active{transform:scale(.94);}
.math-btn.check{background:linear-gradient(135deg,var(--blue),#1D4ED8);color:white;flex:1;font-size:17px;box-shadow:0 4px 15px rgba(59,130,246,.35);}
.math-btn.hint{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#333;}

/* Numpad */
.math-numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:white;border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm);margin-bottom:10px;}
.math-pad-btn{font-family:var(--font-title);font-size:20px;background:#F7FAFC;border:2px solid #E2E8F0;border-radius:var(--radius-sm);padding:14px 6px;cursor:pointer;color:var(--text);transition:background .1s,transform .1s;user-select:none;}
.math-pad-btn:active{transform:scale(.91);}
.math-pad-btn.num{background:white;}
.math-pad-btn.del{background:#FFF3E0;border-color:#FECBA1;color:var(--orange);}
.math-pad-btn.ok{background:linear-gradient(135deg,var(--green),var(--green-dark));border-color:var(--green-dark);color:white;grid-column:span 2;}
.math-pad-btn.neg{background:#F3E5F5;border-color:#CE93D8;color:var(--purple);}

/* Feedback */
.math-feedback{border-radius:var(--radius-sm);padding:13px 18px;font-weight:700;font-size:15px;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center;transition:all .3s;margin-bottom:10px;}
.math-feedback.correct{background:#ECFDF5;color:var(--green-dark);border:2px solid #6EE7B7;}
.math-feedback.wrong{background:#FFF5F5;color:var(--primary-dark);border:2px solid #FCA5A5;}
.math-feedback.idle{background:#F7FAFC;color:var(--text-light);border:2px solid #E2E8F0;}
.math-feedback.loading{background:#EFF6FF;color:var(--blue-dark);border:2px solid #BFDBFE;}

/* Next btn */
.math-next-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--green),var(--green-dark));color:white;border-radius:var(--radius-sm);font-size:16px;font-weight:800;box-shadow:0 4px 15px rgba(16,185,129,.35);border:none;cursor:pointer;transition:transform .2s;}
.math-next-btn:hover{transform:translateY(-2px);}
.math-net-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#CBD5E0;margin-left:6px;vertical-align:middle;transition:background .3s;}
.math-net-dot.online{background:var(--green);}
.math-net-dot.offline{background:var(--primary);}
@keyframes mathSpin{to{transform:rotate(360deg)}}
.math-spinner{display:inline-block;width:16px;height:16px;border:3px solid rgba(59,130,246,.3);border-top-color:var(--blue);border-radius:50%;animation:mathSpin .7s linear infinite;vertical-align:middle;margin-right:6px;}

/* ===== AGENT TAB ===== */
.agent-hero{background:linear-gradient(135deg,#6366F1,#A855F7);border-radius:var(--radius-lg);padding:20px;color:white;margin-bottom:14px;position:relative;overflow:hidden;}
.agent-hero::after{content:'🤖';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:56px;opacity:.2;}
.agent-hero h2{font-family:var(--font-title);font-size:24px;margin-bottom:2px;}
.agent-hero p{font-size:13px;opacity:.9;}

.agent-mode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.agent-mode-btn{flex:1;padding:10px 6px;border-radius:var(--radius-sm);font-weight:800;font-size:13px;border:2.5px solid transparent;background:white;color:var(--text-light);box-shadow:var(--shadow-sm);transition:all .2s;cursor:pointer;}
.agent-mode-btn.active{color:white;border-color:transparent;}
.agent-mode-btn.mode-chat.active{background:linear-gradient(135deg,#6366F1,#A855F7);}
.agent-mode-btn.mode-math.active{background:linear-gradient(135deg,var(--orange),var(--primary));}
.agent-mode-btn.mode-english.active{background:linear-gradient(135deg,var(--green),var(--blue));}

/* Chat area */
.agent-chat{background:white;border-radius:var(--radius);box-shadow:var(--shadow-sm);min-height:280px;max-height:340px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;scroll-behavior:smooth;}
.chat-msg{display:flex;gap:8px;align-items:flex-start;animation:fadeIn .3s ease;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.chat-avatar.bot{background:linear-gradient(135deg,#6366F1,#A855F7);}
.chat-avatar.user{background:linear-gradient(135deg,var(--orange),var(--primary));}
.chat-bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;}
.chat-bubble.bot{background:#F3F4F6;color:var(--text);border-bottom-left-radius:4px;}
.chat-bubble.user{background:linear-gradient(135deg,#6366F1,#A855F7);color:white;border-bottom-right-radius:4px;}
.chat-bubble code{background:rgba(0,0,0,.08);padding:2px 5px;border-radius:4px;font-family:monospace;font-size:13px;}
.chat-bubble.bot code{background:rgba(99,102,241,.12);color:#4338CA;}
.chat-typing{display:flex;gap:4px;padding:10px 14px;background:#F3F4F6;border-radius:18px;border-bottom-left-radius:4px;width:60px;}
.chat-typing span{width:7px;height:7px;background:#A0AEC0;border-radius:50%;animation:typingDot 1.2s infinite;}
.chat-typing span:nth-child(2){animation-delay:.2s;}
.chat-typing span:nth-child(3){animation-delay:.4s;}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* Input row */
.agent-input-row{display:flex;gap:8px;align-items:center;}
.agent-input{flex:1;padding:13px 16px;border:2.5px solid #E2E8F0;border-radius:var(--radius-sm);font-size:15px;background:white;color:var(--text);transition:border-color .2s;}
.agent-input:focus{border-color:#6366F1;outline:none;}
.agent-send-btn{padding:13px 18px;background:linear-gradient(135deg,#6366F1,#A855F7);color:white;border-radius:var(--radius-sm);font-size:20px;border:none;cursor:pointer;transition:transform .15s;box-shadow:0 4px 14px rgba(99,102,241,.35);}
.agent-send-btn:active{transform:scale(.93);}
.agent-send-btn:disabled{opacity:.45;cursor:default;}

/* Suggestion chips */
.agent-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.agent-chip{padding:7px 13px;background:white;border:2px solid #E2E8F0;border-radius:50px;font-size:12px;font-weight:700;color:var(--text-light);cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm);}
.agent-chip:hover{border-color:#6366F1;color:#6366F1;transform:translateY(-1px);}

/* Math gen panel */
.wolfram-gen-card{background:white;border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:12px;}
.wolfram-gen-title{font-weight:900;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.wolfram-gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.wolfram-select{padding:10px 12px;border:2px solid #E2E8F0;border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;font-weight:700;background:white;color:var(--text);cursor:pointer;}
.wolfram-select:focus{outline:none;border-color:#6366F1;}
.wolfram-gen-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--orange),var(--primary));color:white;border-radius:var(--radius-sm);font-size:15px;font-weight:800;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(249,115,22,.35);transition:transform .15s;}
.wolfram-gen-btn:active{transform:scale(.97);}
.wolfram-gen-btn:disabled{opacity:.5;cursor:default;}

/* Wolfram result card */
.wolfram-result{background:#FFFBEB;border:2px solid #FDE68A;border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;display:none;}
.wolfram-result.show{display:block;animation:fadeIn .3s ease;}
.wolfram-result-title{font-weight:900;font-size:13px;color:#92400E;margin-bottom:6px;}
.wolfram-result-body{font-size:15px;color:var(--text);font-weight:700;line-height:1.6;}
.wolfram-result-step{font-size:13px;color:var(--text-light);margin-top:6px;line-height:1.6;}
.wolfram-result img{max-width:100%;border-radius:8px;margin-top:8px;}

/* English mode */
.english-section{background:white;border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:12px;}
.english-section-title{font-weight:900;font-size:14px;margin-bottom:10px;color:var(--text);}
.english-check-input{width:100%;padding:12px 14px;border:2.5px solid #E2E8F0;border-radius:var(--radius-sm);font-size:16px;font-family:var(--font);margin-bottom:8px;}
.english-check-input:focus{outline:none;border-color:var(--green);}
.english-check-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--green),var(--blue));color:white;border-radius:var(--radius-sm);font-weight:800;font-size:15px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.3);}
.wolfram-badge{display:inline-flex;align-items:center;gap:4px;background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:50px;padding:3px 10px;font-size:11px;font-weight:700;color:#C2410C;margin-bottom:10px;}

function toggleLang() {
  currentLang = currentLang === 'en' ? 'ko' : 'en';

  const btn = document.getElementById('lang-toggle-btn');

/* ============================================================

============================================================ */
const CLAUDE_SYSTEM_EN = `You are Claude, a friendly and encouraging AI tutor for kids aged 6-12. 
Your personality:
- Warm, enthusiastic, and patient like a great teacher
- Use simple language appropriate for kids
- Add relevant emojis to make responses fun 🎉
- Give clear, step-by-step explanations when needed
- Encourage and praise effort
- Keep answers concise (2-4 sentences for simple questions, more for complex ones)
- When explaining math, show the working step by step
- If asked in Korean, respond naturally in Korean
- You can handle: math, science, English vocabulary/grammar, general knowledge, creative questions
- Always be safe and age-appropriate`;

const CLAUDE_SYSTEM_KO = `당신은 Claude, 6-12세 어린이를 위한 친절하고 격려하는 AI 선생님입니다.
성격:
- 따뜻하고 열정적이며 인내심 있는 선생님처럼 대화하세요
- 아이들이 이해할 수 있는 쉬운 언어를 사용하세요
- 재미있는 이모지를 적절히 사용하세요 🎉
- 필요할 때 단계별로 명확하게 설명하세요
- 노력을 칭찬하고 격려하세요
- 간결하게 답하세요 (간단한 질문은 2-4문장, 복잡한 건 더 길게)
- 수학 설명 시 풀이 과정을 보여주세요
- 한국어로 질문하면 한국어로 답하고, 영어로 질문하면 영어로 답하세요
- 수학, 과학, 영어 어휘/문법, 일반 상식, 창의적 질문 모두 답할 수 있어요
- 항상 안전하고 어린이에게 적합한 내용만 답하세요`;

async function callClaudeAPI(messages) {
  // Build the system prompt based on language
  const systemPrompt = currentLang === 'ko' ? CLAUDE_SYSTEM_KO : CLAUDE_SYSTEM_EN;
  
  try {
    const resp = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        system: systemPrompt,
        messages: messages,
      }),
      signal: AbortSignal.timeout(30000),
    });
    if(!resp.ok) throw new Error('API error');
    const data = await resp.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';
    return text;
  } catch(e) {
    return null; // fall back to Wolfram
  }
}

// Converts plain markdown-ish text to safe HTML for chat bubbles
function claudeTextToHTML(text) {
  if(!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br>');
}

/* ============================================================
   ONBOARDING
============================================================ */
const OB_STEPS_DATA = [
  { title:"What's your name?", bubble:"Nice to meet you! What should I call you?", type:'name' },
  { title:"How old are you?", bubble:"Almost done! When were you born?", type:'age',
    options:[{label:'8-9 years old',icon:'🌱',val:'8-9'},{label:'10-11 years old',icon:'🌿',val:'10-11'},{label:'12+ years old',icon:'🌳',val:'12+'}] },
  { title:"Are you a...?", bubble:"Tell me about yourself!", type:'gender',
    options:[{label:'Boy',icon:'👦',val:'boy'},{label:'Girl',icon:'👧',val:'girl'},{label:'Other',icon:'🌈',val:'other'}] },
  { title:"Choose your pet!", bubble:"Pick your learning buddy!", type:'pet' },
];

function renderOnboard() {
  const step = state.obStep;
  const data = OB_STEPS_DATA[step];
  const total = OB_STEPS_DATA.length;
  document.getElementById('ob-bubble').textContent = data.bubble;
  // dots
  const dots = Array.from({length:total}, (_,i) =>
    `<div class="ob-dot ${i<=step?'active':''}"></div>`).join('');
  document.getElementById('ob-progress').innerHTML = dots;
  let html = `<div class="ob-title">${data.title}</div>`;
  if(data.type === 'name') {
    html += `<input type="text" id="ob-name-input" style="width:100%;padding:14px 18px;border:2.5px solid #E2E8F0;border-radius:12px;font-size:16px;font-weight:700;margin-bottom:8px;font-family:inherit;" placeholder="Enter your name..." value="${state.user.name||''}"/>`;
  } else if(data.type === 'pet') {
    html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">`;
    PETS.forEach(p => {
      const sel = state.pet.type===p.id;
      html += `<div class="ob-option ${sel?'selected':''}" onclick="selectPet('${p.id}')" style="cursor:pointer;">
        <span class="ob-icon">${p.emoji}</span>${p.name}
      </div>`;
    });
    html += `</div>`;
  } else if(data.options) {
    const cls = data.options.length===3?'grid3':'grid2';
    html += `<div class="ob-options ${cls}">`;
    data.options.forEach(o => {
      const sel = (data.type==='age'&&state.user.age===o.val)||(data.type==='gender'&&state.user.gender===o.val);
      html += `<div class="ob-option ${sel?'selected':''}" onclick="obSelect('${data.type}','${o.val}')">
        <span class="ob-icon">${o.icon}</span>${o.label}
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('ob-content').innerHTML = html;
  const nextBtn = document.getElementById('ob-next-btn');
  nextBtn.textContent = step < total-1 ? 'Next ➡️' : 'Let\'s Go! 🚀';
}

function obSelect(type, val) {
  if(type==='age') state.user.age = val;
  if(type==='gender') state.user.gender = val;
  renderOnboard();
}

function selectPet(id) {
  state.pet.type = id;
  renderOnboard();
}

function obNext() {
  const step = state.obStep;
  if(step===0) {
    const inp = document.getElementById('ob-name-input');
    if(inp) state.user.name = inp.value.trim() || 'Student';
  }
  if(state.obStep < OB_STEPS_DATA.length-1) {
    state.obStep++;
    renderOnboard();
  } else {
    showApp();
  }
}

/* ============================================================
   APP INIT
============================================================ */
function doLogin() {
  showScreen('screen-onboard');
  state.obStep = 0;
  renderOnboard();
}

function showApp() {
  showScreen('screen-app');
  updateHeader();
  showTab('home');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateHeader() {
  const pet = PETS.find(p=>p.id===state.pet.type);
  document.getElementById('header-pet').textContent = pet ? pet.emoji : '🐱';
  document.getElementById('header-name').textContent = state.user.name || 'Student';
  document.getElementById('header-coins').textContent = state.coins;
  const lvl = Math.floor(state.xp / 100) + 1;
  document.getElementById('header-level').textContent = `Level ${lvl} Explorer`;
}

/* ============================================================
   TAB NAVIGATION
============================================================ */
function showTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach((btn,i) => {
    const tabs = ['home','vocab','math','agent','profile'];
    btn.classList.toggle('active', tabs[i]===tab);
  });
  const content = document.getElementById('app-content');
  if(tab==='home') content.innerHTML = renderHome();
  else if(tab==='vocab') content.innerHTML = renderVocab();
  else if(tab==='math') { content.innerHTML = renderMath(); initMathTab(); }
  else if(tab==='flags') content.innerHTML = renderFlags();
  else if(tab==='agent') { content.innerHTML = renderAgent(); initAgent(); }
  else if(tab==='pet') content.innerHTML = renderPet();
  else if(tab==='profile') content.innerHTML = renderProfile();
  updateHeader();
}

function fcNext() {

function fcPrev() {

}

/* ============================================================
   QUIZ SYSTEM
============================================================ */
function startQuiz(category, type) {
  const words = VOCAB_CATEGORIES[category][state.quiz.level] || [];
  const wrongOnly = state.quiz.retryWrong;
  const pool = wrongOnly && state.quiz.wrong.length ? state.quiz.wrong : [...words];
  state.quiz.words = shuffle(pool);
  state.quiz.idx = 0;
  state.quiz.score = 0;
  state.quiz.wrong = [];
  state.quiz.type = type || 'mcq';
  state.quiz.category = category;
  state.quiz.mode = 'vocab';
  state.quiz.retryWrong = false;
  renderQuizQuestion();
}

function startFlagQuiz(type, continent) {
  const countries = continent ? ALL_COUNTRIES[continent] : Object.values(ALL_COUNTRIES).flat();
  state.quiz.words = shuffle(countries).slice(0, 15).map(c => ({
    word: c.name, meaning: c.capital, emoji: c.flag, example: `Capital: ${c.capital}`,
    isFlag: true, country: c
  }));
  state.quiz.idx = 0;
  state.quiz.score = 0;
  state.quiz.wrong = [];
  state.quiz.type = type || 'mcq';
  state.quiz.mode = 'flags';
  state.quiz.retryWrong = false;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const { words, idx, score, type } = state.quiz;
  if(idx >= words.length) { showQuizResult(); return; }
  const w = words[idx];
  const pct = Math.round(idx/words.length*100);
  if(type==='matching') { renderMatchingGame(); return; }
  if(type==='car') { renderCarGame(); return; }
  const allWords = type==='mcq' ? (state.quiz.mode==='flags' ? Object.values(ALL_COUNTRIES).flat().map(c=>({word:c.name,emoji:c.flag})) : (VOCAB_CATEGORIES[state.quiz.category]?.[state.quiz.level]||[])) : [];
  let options = [];
  if(type==='mcq') {
    const others = shuffle(allWords.filter(x=>x.word!==w.word)).slice(0,3);
    options = shuffle([w,...others]);
  }
  document.getElementById('app-content').innerHTML = `
  <div>
    <div class="quiz-header">
      <div class="quiz-meta">
        <div class="quiz-score">Score: ${score}/${words.length}</div>
        <div class="quiz-type-badge">${type==='mcq'?'Multiple Choice':type==='typing'?'Typing':'Quiz'}</div>
        <button style="background:none;border:none;font-size:22px;cursor:pointer;" onclick="showTab('vocab')">✕</button>
      </div>
      <div class="fc-progress"><div class="fc-progress-bar" style="width:${pct}%"></div></div>
    </div>
    <div class="quiz-body">
      <div class="quiz-question-card">
        <span class="quiz-question-emoji">${w.emoji}</span>
        <div class="quiz-question-text">${state.quiz.mode==='flags'?'Which country is this flag?':w.word}</div>
        <div class="quiz-question-sub">${state.quiz.mode==='flags'?w.word:'What does this mean in Korean?'}</div>
      </div>
      ${type==='mcq' ? `
      <div class="quiz-options">
        ${options.map(o=>`
          <button class="quiz-option" onclick="checkAnswer('${o.word.replace(/'/g,"\\'")}','${w.word.replace(/'/g,"\\'")}')" data-val="${o.word}">
            ${o.emoji||''} ${state.quiz.mode==='flags'?o.word:o.meaning||o.word}
          </button>`).join('')}
      </div>` : `
      <div style="margin-bottom:16px;">
        <input class="quiz-input" id="typing-input" placeholder="Type the ${state.quiz.mode==='flags'?'country name':'Korean meaning'}..." onkeydown="if(event.key==='Enter')submitTyping('${w.word.replace(/'/g,"\\'")}','${w.meaning?.replace(/'/g,"\\'") || w.word}')"/>
        <button class="quiz-submit-btn" onclick="submitTyping('${w.word.replace(/'/g,"\\'")}','${w.meaning?.replace(/'/g,"\\'") || w.word}')">✓ Check</button>
      </div>`}
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;">
        <button style="background:#F0F0F0;color:var(--text);padding:10px 20px;border-radius:50px;font-size:14px;font-weight:700;" onclick="switchQuizType('mcq')">📋 MCQ</button>
        <button style="background:#F0F0F0;color:var(--text);padding:10px 20px;border-radius:50px;font-size:14px;font-weight:700;" onclick="switchQuizType('typing')">⌨️ Type</button>
        <button style="background:#F0F0F0;color:var(--text);padding:10px 20px;border-radius:50px;font-size:14px;font-weight:700;" onclick="switchQuizType('matching')">🔗 Match</button>
        <button style="background:#F0F0F0;color:var(--text);padding:10px 20px;border-radius:50px;font-size:14px;font-weight:700;" onclick="switchQuizType('car')">🏎️ Car</button>
      </div>
    </div>
  </div>`;
  if(type==='typing') setTimeout(()=>document.getElementById('typing-input')?.focus(),100);
}

function switchQuizType(type) {
  state.quiz.type = type;
  renderQuizQuestion();
}

function checkAnswer(chosen, correct) {
  const isCorrect = chosen === correct;
  document.querySelectorAll('.quiz-option').forEach(btn => {
    btn.disabled = true;
    if(btn.dataset.val===correct) btn.classList.add('correct');
    if(btn.dataset.val===chosen && !isCorrect) btn.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-feedback');
  fb.className = `quiz-feedback show ${isCorrect?'correct':'wrong'}`;
  fb.textContent = isCorrect ? '🎉 Correct! Great job!' : `❌ Wrong! The answer is: ${correct}`;
  if(!isCorrect) state.quiz.wrong.push(state.quiz.words[state.quiz.idx]);
  else state.quiz.score++;
  if(isCorrect) launchMiniConfetti();
  setTimeout(() => { state.quiz.idx++; renderQuizQuestion(); }, 1400);
}

function submitTyping(word, meaning) {
  const inp = document.getElementById('typing-input');
  if(!inp) return;
  const val = inp.value.trim().toLowerCase();
  const correct = meaning.toLowerCase().split('(')[0].trim();
  const isCorrect = val === correct || val === word.toLowerCase() || correct.includes(val) && val.length > 2;
  const fb = document.getElementById('quiz-feedback');
  fb.className = `quiz-feedback show ${isCorrect?'correct':'wrong'}`;
  fb.textContent = isCorrect ? '🎉 Correct!' : `❌ Wrong! Answer: ${meaning} (${word})`;
  inp.disabled = true;
  document.querySelector('.quiz-submit-btn').disabled = true;
  if(!isCorrect) state.quiz.wrong.push(state.quiz.words[state.quiz.idx]);
  else state.quiz.score++;
  if(isCorrect) launchMiniConfetti();
  setTimeout(() => { state.quiz.idx++; renderQuizQuestion(); }, 1500);
}

/* ============================================================
   MATCHING GAME
============================================================ */
let matchState = { selected: null, matched: [], wrong: [] };

function renderMatchingGame() {
  const { words, idx } = state.quiz;
  const batch = words.slice(idx, idx+6);
  if(!batch.length) { showQuizResult(); return; }
  matchState = { selected: null, matched: [], wrong: [], batch, quizIdx: idx };
  renderMatchBoard();
}

function renderMatchBoard() {
  const { batch } = matchState;
  const lefts = shuffle([...batch]).map(w => ({...w, side:'left'}));
  const rights = shuffle([...batch]).map(w => ({...w, side:'right'}));
  matchState.lefts = lefts; matchState.rights = rights;
  let html = `
  <div class="quiz-header">
    <div class="quiz-meta">
      <div class="quiz-score">Score: ${state.quiz.score}/${state.quiz.words.length}</div>
      <div class="quiz-type-badge">Matching Game 🔗</div>
      <button style="background:none;border:none;font-size:22px;cursor:pointer;" onclick="showTab('vocab')">✕</button>
    </div>
  </div>
  <div class="quiz-body">
    <div style="font-weight:800;font-size:16px;margin-bottom:14px;text-align:center;">Match the pairs! 🎯</div>
    <div class="matching-grid">
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${lefts.map((w,i)=>`
        <div class="match-item ${matchState.matched.find(m=>m.word===w.word)?'matched':''}" id="match-l-${i}" onclick="matchClick('left',${i})">
          <span class="match-emoji">${w.emoji}</span>
          <span>${w.word}</span>
        </div>`).join('')}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${rights.map((w,i)=>`
        <div class="match-item ${matchState.matched.find(m=>m.word===w.word)?'matched':''}" id="match-r-${i}" onclick="matchClick('right',${i})">
          <span>${state.quiz.mode==='flags'?w.meaning||w.word:w.meaning||w.word}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="quiz-feedback" id="quiz-feedback" style="margin-top:12px;"></div>
  </div>`;
  document.getElementById('app-content').innerHTML = html;
}

function matchClick(side, idx) {
  if(!matchState.selected) {
    matchState.selected = {side, idx};
    const el = document.getElementById(`match-${side[0]}-${idx}`);
    el?.classList.add('selected');
  } else {
    const prev = matchState.selected;
    if(prev.side === side) {
      document.getElementById(`match-${prev.side[0]}-${prev.idx}`)?.classList.remove('selected');
      matchState.selected = {side, idx};
      document.getElementById(`match-${side[0]}-${idx}`)?.classList.add('selected');
      return;
    }
    const leftIdx = side==='right' ? prev.idx : idx;
    const rightIdx = side==='right' ? idx : prev.idx;
    const leftWord = matchState.lefts[leftIdx];
    const rightWord = matchState.rights[rightIdx];
    const isMatch = leftWord.word === rightWord.word;
    const lEl = document.getElementById(`match-l-${leftIdx}`);
    const rEl = document.getElementById(`match-r-${rightIdx}`);
    if(isMatch) {
      lEl?.classList.add('matched'); rEl?.classList.add('matched');
      lEl?.classList.remove('selected');
      matchState.matched.push(leftWord);
      state.quiz.score++;
      const fb = document.getElementById('quiz-feedback');
      if(fb) { fb.className='quiz-feedback show correct'; fb.textContent='✓ Match!'; }
      if(matchState.matched.length === matchState.batch.length) {
        state.quiz.idx += matchState.batch.length;
        setTimeout(() => renderQuizQuestion(), 800);
      }
    } else {
      lEl?.classList.add('wrong-match'); rEl?.classList.add('wrong-match');
      lEl?.classList.remove('selected');
      state.quiz.wrong.push(leftWord);
      const fb = document.getElementById('quiz-feedback');
      if(fb) { fb.className='quiz-feedback show wrong'; fb.textContent=`✗ Not a match! ${leftWord.word} ≠ ${rightWord.meaning||rightWord.word}`; }
      setTimeout(() => { lEl?.classList.remove('wrong-match'); rEl?.classList.remove('wrong-match'); if(fb)fb.className='quiz-feedback'; }, 1000);
    }
    matchState.selected = null;
  }
}

/* ============================================================
   CAR GAME
============================================================ */
let carGameState = { pos: 0 };

function renderCarGame() {
  const { words, idx, score } = state.quiz;
  if(idx >= words.length) { showQuizResult(); return; }
  const w = words[idx];
  const allWords = state.quiz.mode==='flags' ? Object.values(ALL_COUNTRIES).flat().map(c=>({word:c.name,emoji:c.flag,meaning:c.capital})) : (VOCAB_CATEGORIES[state.quiz.category]?.[state.quiz.level]||[]);
  const others = shuffle(allWords.filter(x=>x.word!==w.word)).slice(0,3);
  const options = shuffle([w,...others]);
  const carPct = Math.round(idx/words.length*100);
  const pet = PETS.find(p=>p.id===state.pet.type);
  document.getElementById('app-content').innerHTML = `
  <div class="quiz-header">
    <div class="quiz-meta">
      <div class="quiz-score">🏎️ Race: ${score}/${words.length}</div>
      <div class="quiz-type-badge">Car Race Game!</div>
      <button style="background:none;border:none;font-size:22px;cursor:pointer;" onclick="showTab('vocab')">✕</button>
    </div>
  </div>
  <div class="quiz-body">
    <div class="car-game">
      <div class="car-road">
        <div class="car-emoji" style="left:${carPct}%">${pet?pet.emoji:'🏎️'}</div>
        <div class="car-finish">🏁</div>
      </div>
      <div class="car-progress-text">${idx+1}/${words.length} questions • Go go go! 🚀</div>
      <div class="car-question">
        <div class="cq-emoji">${w.emoji}</div>
        <div class="cq-word">${w.word}</div>
      </div>
      <div class="race-opts">
        ${options.map(o=>`
        <button class="race-btn" onclick="carAnswer('${o.word.replace(/'/g,"\\'")}','${w.word.replace(/'/g,"\\'")}',this)">
          ${o.emoji||''} ${state.quiz.mode==='flags'?o.word:o.meaning||o.word}
        </button>`).join('')}
      </div>
      <div class="quiz-feedback" id="quiz-feedback" style="margin-top:12px;"></div>

function carAnswer(chosen, correct, btn) {
  document.querySelectorAll('.race-btn').forEach(b=>b.disabled=true);
  const isCorrect = chosen === correct;
  btn.classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect) {
    document.querySelectorAll('.race-btn').forEach(b=>{
      if(b.textContent.trim().includes(correct.slice(0,5))) b.classList.add('correct');
    });
  }
  const fb = document.getElementById('quiz-feedback');
  if(fb) { fb.className=`quiz-feedback show ${isCorrect?'correct':'wrong'}`; fb.textContent = isCorrect?'🎉 Correct! ZOOM! 🏎️💨':`❌ Wrong! Answer: ${correct}`; }
  if(!isCorrect) state.quiz.wrong.push(state.quiz.words[state.quiz.idx]);
  else { state.quiz.score++; launchMiniConfetti(); }
  setTimeout(()=>{ state.quiz.idx++; renderCarGame(); }, 1400);
}

/* ============================================================
   QUIZ RESULT
============================================================ */
function showQuizResult() {
  const { score, words, wrong, category, mode } = state.quiz;
  const total = words.length;
  const pct = total ? Math.round(score/total*100) : 0;
  const medal = pct>=90 ? 'gold' : pct>=70 ? 'silver' : 'bronze';
  const medalEmoji = medal==='gold'?'🥇':medal==='silver'?'🥈':'🥉';
  const xpEarned = score * 10;
  state.xp += xpEarned;
  state.coins += score * 5;
  if(category) {
    state.medals = state.medals.filter(m=>m.category!==category);
    state.medals.push({category, medal, score, total});
  }
  if(pct>=90) launchConfetti();
  updateHeader();
  document.getElementById('app-content').innerHTML = `
  <div class="quiz-result">
    <span class="result-medal">${medalEmoji}</span>
    <div class="result-title">${medal==='gold'?'Perfect!':medal==='silver'?'Great Job!':'Keep Trying!'}</div>
    <div class="result-score">${score} out of ${total} correct (${pct}%)</div>
    <div class="result-stats">
      <div class="result-stat"><div class="rs-num">+${xpEarned}</div><div class="rs-label">XP Earned</div></div>
      <div class="result-stat"><div class="rs-num">+${score*5}🪙</div><div class="rs-label">Coins</div></div>
      <div class="result-stat"><div class="rs-num">${pct}%</div><div class="rs-label">Accuracy</div></div>
    </div>
    ${wrong.length ? `
    <div class="wrong-answers-list">
      <h3>❌ Words to review (${wrong.length}):</h3>
      ${wrong.map(w=>`<div class="wrong-answer-item"><span style="font-size:20px">${w.emoji}</span><span><strong>${w.word}</strong> → ${w.meaning||''}</span></div>`).join('')}
    </div>` : ''}
    <div class="result-btns">
      ${wrong.length ? `<button class="btn-retry-wrong" onclick="retryWrong()">🔄 Retry Wrong Answers (${wrong.length})</button>` : ''}
      <button class="btn-retry" onclick="startQuiz('${category}','mcq')">🎮 Play Again</button>
      <button class="btn-home-result" onclick="showTab('${mode==='flags'?'flags':'vocab'}')">← Back</button>
    </div>
  </div>`;
}

function retryWrong() {
  state.quiz.retryWrong = true;
  const wrong = [...state.quiz.wrong];
  state.quiz.words = shuffle(wrong);
  state.quiz.idx = 0;
  state.quiz.score = 0;
  state.quiz.wrong = [];
  renderQuizQuestion();
}

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function speak(text, event) {
  if(event) event.stopPropagation();
  if('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }
}

// ── 학년/난이도 설정 ──────────────────────────────────────────
const MATH_GRADE_CONFIG = {
  '1-1':{ name:'1학년 · 쉬움',   desc:'10 이하 덧/뺄',     goal:5,  types:['add_small','sub_small'] },
  '1-2':{ name:'1학년 · 보통',   desc:'20 이하 덧/뺄',     goal:6,  types:['add_teen','sub_teen'] },
  '1-3':{ name:'1학년 · 어려움', desc:'받아올림/내림',       goal:7,  types:['add_carry','sub_borrow'] },
  '2-1':{ name:'2학년 · 쉬움',   desc:'2~5단 곱셈',        goal:6,  types:['mul_easy'] },
  '2-2':{ name:'2학년 · 보통',   desc:'100 이하 혼합+곱셈', goal:7,  types:['add_100','sub_100','mul_easy'] },
  '2-3':{ name:'2학년 · 어려움', desc:'세 자리 연산',       goal:8,  types:['add_3digit','sub_3digit'] },
  '3-1':{ name:'3학년 · 쉬움',   desc:'구구단+나눗셈',      goal:7,  types:['mul_full','div_easy'] },
  '3-2':{ name:'3학년 · 보통',   desc:'두자리×한자리',      goal:8,  types:['mul_2x1','div_full'] },
  '3-3':{ name:'3학년 · 어려움', desc:'두자리×두자리',      goal:10, types:['mul_2x2','div_full','add_3digit'] },
};

const MATH_OP_INFO = {
  '+':{label:'➕ 덧셈',cls:'math-op-add'},
  '-':{label:'➖ 뺄셈',cls:'math-op-sub'},
  '*':{label:'✖ 곱셈',cls:'math-op-mul'},
  '/':{label:'➗ 나눗셈',cls:'math-op-div'},
};

// state
let mathState = {
  grade:1, diff:1, lives:3, mathScore:0, xp:0,
  current:null, hintUsed:false, loading:false,
  online:true,
};

const mri = (lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));

function mathMakeProb(op,a,b){
  if(op==='+'){
    if(a===null)a=mri(1,50);if(b===null)b=mri(1,50);
    return{display:`${a} + ${b} = ?`,answer:a+b,op:'+',a,b,hint:`${a}에서 ${b}을(를) 더해요!`};
  }
  if(op==='-'){
    if(b===null)b=mri(1,Math.max(1,a-1));
    return{display:`${a} - ${b} = ?`,answer:a-b,op:'-',a,b,hint:`${a}에서 ${b}을(를) 빼요!`};
  }
  if(op==='*'){
    if(a===null)a=mri(2,9);if(b===null)b=mri(2,9);
    const parts=[...Array(Math.min(b,4))].map(()=>a).join('+')+(b>4?'...':'');
    return{display:`${a} × ${b} = ?`,answer:a*b,op:'*',a,b,hint:`${a}를 ${b}번 더해요! (${parts})`};
  }
  if(op==='/'){
    if(b===null)b=mri(2,9);const ans=mri(1,9);a=b*ans;
    return{display:`${a} ÷ ${b} = ?`,answer:ans,op:'/',a,b,hint:`${b}를 몇 번 더하면 ${a}가 될까요?`};
  }
}

const MATH_GEN={
  add_small: ()=>mathMakeProb('+',mri(1,9),   mri(1,9)),
  sub_small: ()=>mathMakeProb('-',mri(2,10),  null),
  add_teen:  ()=>mathMakeProb('+',mri(1,19),  mri(1,19)),
  sub_teen:  ()=>mathMakeProb('-',mri(5,20),  null),
  add_carry: ()=>mathMakeProb('+',mri(6,19),  mri(6,19)),
  sub_borrow:()=>mathMakeProb('-',mri(11,30), null),
  add_100:   ()=>mathMakeProb('+',mri(10,90), mri(10,90)),
  sub_100:   ()=>mathMakeProb('-',mri(20,99), null),
  mul_easy:  ()=>mathMakeProb('*',mri(2,5),   mri(2,9)),
  add_3digit:()=>mathMakeProb('+',mri(100,899),mri(10,99)),
  sub_3digit:()=>mathMakeProb('-',mri(200,999),null),
  mul_full:  ()=>mathMakeProb('*',mri(2,9),   mri(2,9)),
  div_easy:  ()=>mathMakeProb('/',null,       mri(2,5)),
  mul_2x1:   ()=>mathMakeProb('*',mri(10,99), mri(2,9)),
  div_full:  ()=>mathMakeProb('/',null,       mri(2,9)),
  mul_2x2:   ()=>mathMakeProb('*',mri(10,30), mri(10,20)),
};

function mathLocalGen(grade,diff){
  const key=`${grade}-${diff}`;
  const cfg=MATH_GRADE_CONFIG[key]||MATH_GRADE_CONFIG['1-1'];
  const types=cfg.types;
  const t=types[Math.floor(Math.random()*types.length)];
  const prob=MATH_GEN[t]();
  prob.grade_name=cfg.name; prob.grade_goal=cfg.goal;
  return prob;
}

// ── API with fallback ─────────────────────────────────────────
const MATH_API = window.location.origin;
let mathNetCheckTimer = null;

async function mathPingServer(){
  try{
    const r=await fetch(`${MATH_API}/api/grades`,{signal:AbortSignal.timeout(2500)});
    mathState.online=r.ok;
  }catch{mathState.online=false;}
  const dot=document.getElementById('math-net-dot');
  if(dot){dot.className='math-net-dot '+(mathState.online?'online':'offline');dot.title=mathState.online?'서버 연결됨':'오프라인 모드';}
}

async function mathFetchOrLocal(grade,diff){
  if(mathState.online){
    try{
      const r=await fetch(`${MATH_API}/api/problem?grade=${grade}&diff=${diff}`,{signal:AbortSignal.timeout(3500)});
      if(r.ok)return{prob:await r.json(),online:true};
    }catch{}
    mathState.online=false;
  }
  return{prob:mathLocalGen(grade,diff),online:false};
}

async function mathCheckOrLocal(userAns,correct,hintUsed){
  if(mathState.online){
    try{
      const r=await fetch(`${MATH_API}/api/check`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({answer:userAns,correct,hint_used:hintUsed}),
        signal:AbortSignal.timeout(3500),
      });
      if(r.ok)return r.json();
    }catch{}
    mathState.online=false;
  }
  const ok=userAns===correct;
  return{correct:ok,points:ok?(hintUsed?5:10):0,
    direction:userAns>correct?'down':'up',
    message:ok?'정답이에요! 🎉':`틀렸어요 😢 정답은 ${correct}이에요!`};
}

async function mathNextProblem(){
  if(mathState.loading) return;
  mathState.loading=true; mathState.hintUsed=false;

  mathSetFeedback('loading','<span class="math-spinner"></span>문제 생성 중...');
  const inp=document.getElementById('math-answer-input');
  if(inp){inp.value='';inp.className='math-answer-input';}
  const hb=document.getElementById('math-hint-btn');if(hb)hb.style.opacity='1';
  const cb=document.getElementById('math-check-btn');if(cb)cb.disabled=true;

  const{prob}=await mathFetchOrLocal(mathState.grade,mathState.diff);
  mathState.current=prob;

  const pd=document.getElementById('math-problem-display');
  if(pd)pd.textContent=prob.display;
  const ht=document.getElementById('math-hint-text');
  if(ht)ht.textContent='💬 숫자를 입력하거나 키패드를 눌러요!';

  const opInfo=MATH_OP_INFO[prob.op]||MATH_OP_INFO['+'];
  const badge=document.getElementById('math-op-badge');
  if(badge){badge.textContent=opInfo.label;badge.className='math-op-badge '+opInfo.cls;}

  mathSetFeedback('idle','문제를 풀어보세요! 💪');
  mathState.loading=false;
  if(cb)cb.disabled=false;
  mathUpdateUI();
}

async function mathCheckAnswer(){
  if(!mathState.current||mathState.loading)return;
  const inp=document.getElementById('math-answer-input');
  const val=parseInt(inp.value);
  if(isNaN(val)){mathSetFeedback('wrong','숫자를 입력해 주세요! 🔢');return;}

  mathState.loading=true;
  const cb=document.getElementById('math-check-btn');if(cb)cb.disabled=true;

  const result=await mathCheckOrLocal(val,mathState.current.answer,mathState.hintUsed);

  if(result.correct){
    mathState.mathScore+=result.points; mathState.xp+=1;
    if(inp)inp.className='math-answer-input correct';
    mathSetFeedback('correct',`🎉 ${result.message} +${result.points}점`);
    launchMiniConfetti();
    state.xp+=result.points; state.coins+=Math.floor(result.points/2);
    updateHeader();

    const goal=(MATH_GRADE_CONFIG[`${mathState.grade}-${mathState.diff}`]||{}).goal||5;
    if(mathState.xp>=goal){
      setTimeout(()=>{
        if(mathState.diff<3){mathState.diff++;}
        else if(mathState.grade<3){mathState.grade++;mathState.diff=1;}
        mathState.xp=0;
        launchConfetti();
        mathUpdateGradeButtons();
        mathSetFeedback('correct',`🚀 레벨 업! ${(MATH_GRADE_CONFIG[`${mathState.grade}-${mathState.diff}`]||{}).name||''}`);
        mathUpdateUI();
      },1400);
    }
  }else{
    mathState.lives=Math.max(0,mathState.lives-1);
    if(inp)inp.className='math-answer-input wrong';
    const tip=result.direction==='down'?'더 작은 수예요 👇':'더 큰 수예요 👆';
    mathSetFeedback('wrong',`${result.message} (${tip})`);
    if(mathState.lives===0){
      setTimeout(()=>{
        mathState.lives=3;mathState.mathScore=0;mathState.xp=0;mathState.grade=1;mathState.diff=1;
        mathUpdateGradeButtons();
        mathSetFeedback('idle','다시 시작해요! 화이팅 💪');
        mathUpdateUI();mathNextProblem();
      },2000);
    }
  }
  mathUpdateUI();
  mathState.loading=false;
  if(cb)cb.disabled=false;
}

  mathState.hintUsed=true;

// All Wolfram queries go through Flask /api/wolfram to avoid CORS
// Falls back to a simple local parser if server is offline
async function wolframQuery(q, full=false) {
  const endpoint = full
    ? `/api/wolfram/full?q=${encodeURIComponent(q)}`
    : `/api/wolfram?q=${encodeURIComponent(q)}`;
  try {
    const r = await fetch(endpoint, {signal: AbortSignal.timeout(8000)});
    if(r.ok) {
      const data = await r.json();
      return data;
    }
  } catch(e) {}
  return null;
}

async function agentChatSend() {
  const inp = document.getElementById('agent-chat-input');
  if(!inp) return;
  const q = inp.value.trim();
  if(!q) return;
  inp.value = '';

  // Add user message
  agentState.chatHistory.push({role:'user', text: escapeHTML(q)});
  agentRefreshChat(true); // show typing

  const btn = document.getElementById('agent-send-btn');
  if(btn) btn.disabled = true;

  // Build messages for Claude (keep last 10 turns for context)
  const apiMessages = agentState.chatHistory.slice(-10).map(m => ({
    role: m.role === 'bot' ? 'assistant' : 'user',
    content: m.rawText || m.text.replace(/<[^>]+>/g, ''), // strip HTML for API
  }));

  let botReply = '';
  let rawText = '';

  // 1. Try Claude API first
  const claudeResp = await callClaudeAPI(apiMessages);

  if(claudeResp) {
    rawText = claudeResp;
    botReply = claudeTextToHTML(claudeResp);
  } else {
    // 2. Fall back to Wolfram
    const result = await wolframQuery(q);
    if(result && result.answer) {
      botReply = formatWolframAnswer(q, result);
      rawText = result.answer;
    } else {
      // 3. Local fallback
      botReply = localSmartAnswer(q);
      rawText = botReply.replace(/<[^>]+>/g,'');
    }
  }

  agentState.chatHistory.push({role:'bot', text: botReply, rawText});
  agentRefreshChat(false);
  if(btn) btn.disabled = false;

  // Award XP
  state.xp += 3; updateHeader();
}

function formatWolframAnswer(q, data) {
  let html = '';
  if(data.answer) html += `<b>Answer:</b> <code>${escapeHTML(data.answer)}</code>`;
  if(data.steps && data.steps.length) {
    html += '<br><br><span style="font-size:12px;color:#718096;">Step-by-step:</span><br>';
    html += data.steps.slice(0,3).map(s=>`<span style="font-size:12px;">• ${escapeHTML(s)}</span>`).join('<br>');
  }
  if(data.image) html += `<br><img src="${data.image}" alt="Wolfram result" onerror="this.style.display='none'"/>`;
  return html || `<b>Result:</b> ${escapeHTML(data.raw||'No result found.')}`;
}

// Smart local fallback (runs without server)
function localSmartAnswer(q) {
  const ql = q.toLowerCase().trim();

  // Simple arithmetic
  const arithMatch = q.match(/^[\d\s\+\-\*\/\×\÷\^\.()]+$/);
  if(arithMatch) {
    try {
      const clean = q.replace(/×/g,'*').replace(/÷/g,'/');
      const val = Function('"use strict"; return ('+clean+')')();
      if(!isNaN(val)) return `<b>${q.trim()} = <code>${val}</code></b> 🎉`;
    } catch(e) {}
  }

  // Spell check trigger
  if(ql.startsWith('spell')) {
    const word = q.replace(/spell\s*/i,'').trim();
    return `The spelling of <b>"${escapeHTML(word)}"</b> is: <code>${escapeHTML(word)}</code><br><small>Tip: Ask me to define it too!</small>`;
  }

  // Define
  if(ql.startsWith('define') || ql.startsWith('what is a') || ql.startsWith('what is an')) {
    const word = q.replace(/define\s*:?\s*|what is an?\s*/i,'').trim();
    return `I searched for <b>"${escapeHTML(word)}"</b>. The server couldn't reach Wolfram|Alpha right now — try again in a moment! 🔄`;
  }

  // Pi
  if(ql.includes('what is π') || ql.includes('what is pi')) {
    return `π (Pi) ≈ <code>3.14159265...</code><br>It's the ratio of a circle's circumference to its diameter! 🔵`;
  }

  // Moon distance
  if(ql.includes('moon') && ql.includes('far')) {
    return `The Moon is about <code>384,400 km</code> (238,855 miles) away from Earth! 🌕`;
  }

  // Times tables
  const timesMatch = q.match(/(\d+)\s*[×x\*]\s*(\d+)/);
  if(timesMatch) {
    const a=parseInt(timesMatch[1]), b=parseInt(timesMatch[2]);
    return `<b>${a} × ${b} = <code>${a*b}</code></b> ✖️🎉`;
  }

  // Addition/subtraction
  const addMatch = q.match(/(\d+)\s*\+\s*(\d+)/);
  if(addMatch) return `<b>${addMatch[1]} + ${addMatch[2]} = <code>${parseInt(addMatch[1])+parseInt(addMatch[2])}</code></b> ➕🎉`;
  const subMatch = q.match(/(\d+)\s*\-\s*(\d+)/);
  if(subMatch) return `<b>${subMatch[1]} - ${subMatch[2]} = <code>${parseInt(subMatch[1])-parseInt(subMatch[2])}</code></b> ➖🎉`;
  const divMatch = q.match(/(\d+)\s*[÷\/]\s*(\d+)/);
  if(divMatch) {
    const a=parseInt(divMatch[1]), b=parseInt(divMatch[2]);
    if(b!==0) return `<b>${a} ÷ ${b} = <code>${(a/b).toFixed(a%b===0?0:2)}</code></b> ➗🎉`;
  }

  return `I couldn't reach Wolfram|Alpha right now 🔄<br>Try: <i>"What is 7 × 8?"</i> or <i>"Spell necessary"</i>`;
}
