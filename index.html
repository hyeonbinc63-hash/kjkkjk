        <option value="fractions"      ${agentState.mathTopic==='fractions'?'selected':''}>${isKo?'분수':'Fractions'}</option>
        <option value="word_problem"   ${agentState.mathTopic==='word_problem'?'selected':''}>${isKo?'문장제':'Word Problem'}</option>
      </select>
    </div>
    <button class="wolfram-gen-btn" id="wf-gen-btn" onclick="agentGenProblem()">
      ⚡ ${isKo?'Claude AI로 문제 생성':'Generate with Claude AI'}
    </button>
  </div>

  <div class="wolfram-result ${prob?'show':''}" id="wf-result">
    ${prob ? agentRenderProblemCard(prob) : ''}
  </div>

  <div id="wf-answer-section" style="display:${prob?'block':'none'}">
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input class="agent-input" id="wf-user-ans" type="number" placeholder="${isKo?'답을 입력하세요…':'Your answer…'}" inputmode="numeric"
        onkeydown="if(event.key==='Enter')agentCheckWfAnswer()" style="font-size:20px;font-weight:800;text-align:center;"/>
      <button class="agent-send-btn" onclick="agentCheckWfAnswer()">✓</button>
    </div>
    <div id="wf-feedback" style="display:none;" class="math-feedback idle"></div>
    <div id="wf-step-solution" style="display:none;" class="wolfram-result show" style="margin-top:8px;"></div>
  </div>
  `;
}

function agentRenderProblemCard(prob) {
  return `
  <div class="wolfram-result-title">📝 ${prob.topic} — ${prob.grade}</div>
  <div class="wolfram-result-body">${escapeHTML(prob.question)}</div>
  ${prob.hint ? `<div class="wolfram-result-step">💡 Hint: ${escapeHTML(prob.hint)}</div>` : ''}
  `;
}

async function agentGenProblem() {
  const grade = document.getElementById('wf-grade')?.value || agentState.mathGrade;
  const topic = document.getElementById('wf-topic')?.value || agentState.mathTopic;
  agentState.mathGrade = grade; agentState.mathTopic = topic;

  const btn = document.getElementById('wf-gen-btn');
  if(btn){ btn.disabled=true; btn.textContent= currentLang==='ko' ? '⏳ 생성 중…' : '⏳ Generating…'; }

  // Build a Wolfram query that generates AND solves a problem, then we present the question
  const prob = await buildWolframProblem(grade, topic);
  agentState.genProblem = prob;

  // Reset answer section
  const wfFb = document.getElementById('wf-feedback');
  const wfStep = document.getElementById('wf-step-solution');
  const wfAns = document.getElementById('wf-user-ans');
  if(wfFb){wfFb.style.display='none';}
  if(wfStep){wfStep.style.display='none';}
  if(wfAns){wfAns.value='';}

  const resultEl = document.getElementById('wf-result');
  if(resultEl){ resultEl.className='wolfram-result show'; resultEl.innerHTML=agentRenderProblemCard(prob); }
  const ansSection = document.getElementById('wf-answer-section');
  if(ansSection) ansSection.style.display='block';

  if(btn){ btn.disabled=false; btn.textContent= currentLang==='ko' ? '⚡ Claude AI로 문제 생성' : '⚡ Generate with Claude AI'; }
}

async function buildWolframProblem(grade, topic) {
  // Generate numbers based on grade
  const ranges = {
    grade1:{ add:[1,20], sub:[1,20], mul:[1,5], div:[1,5] },
    grade2:{ add:[10,99], sub:[10,99], mul:[2,9], div:[2,9] },
    grade3:{ add:[100,500], sub:[100,500], mul:[10,30], div:[2,12] },
  };
  const rng = ranges[grade] || ranges.grade1;

  let question='', answer=0, hint='', wolframQ='', actualTopic=topic;

  if(topic==='mixed') {
    const ops=['+','-','×','÷'];
    actualTopic = ['addition','subtraction','multiplication','division'][Math.floor(Math.random()*4)];
  }

  const ri=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));

  if(actualTopic==='addition'||topic==='addition') {
    const a=ri(...rng.add), b=ri(...rng.add);
    question=`What is ${a} + ${b}?`; answer=a+b;
    hint=`Try counting up from ${a} by ${b}.`; wolframQ=`${a}+${b}`;
  } else if(actualTopic==='subtraction'||topic==='subtraction') {
    let a=ri(...rng.sub), b=ri(1,a);
    question=`What is ${a} − ${b}?`; answer=a-b;
    hint=`Start at ${a} and count down ${b}.`; wolframQ=`${a}-${b}`;
  } else if(actualTopic==='multiplication'||topic==='multiplication') {
    const a=ri(...rng.mul), b=ri(...rng.mul);
    question=`What is ${a} × ${b}?`; answer=a*b;
    hint=`Add ${a} a total of ${b} times.`; wolframQ=`${a}*${b}`;
  } else if(actualTopic==='division'||topic==='division') {
    const b=ri(...rng.div); const ans=ri(1,10); const a=b*ans;
    question=`What is ${a} ÷ ${b}?`; answer=ans;
    hint=`How many times does ${b} go into ${a}?`; wolframQ=`${a}/${b}`;
  } else if(topic==='fractions') {
    const dens=[2,3,4,5]; const d=dens[Math.floor(Math.random()*dens.length)];
    const n1=ri(1,d-1), n2=ri(1,d-1);
    const sum = n1+n2; const display = sum>=d ? `${Math.floor(sum/d)} and ${sum%d}/${d}` : `${sum}/${d}`;
    question=`What is ${n1}/${d} + ${n2}/${d}?`; answer=sum; // stored as numerator for checking
    hint=`Add the numerators: ${n1} + ${n2}, keep the denominator ${d}.`;
    wolframQ=`${n1}/${d}+${n2}/${d}`;
  } else if(topic==='word_problem') {
    const a=ri(2,15), b=ri(2,15);
    const scenarios=[
      {q:`Sam has ${a} apples. He gets ${b} more. How many apples does Sam have now?`, ans:a+b, wq:`${a}+${b}`},
      {q:`There are ${a*b} students in ${a} equal groups. How many students are in each group?`, ans:b, wq:`${a*b}/${a}`},
      {q:`Lily has ${a+b} stickers and gives away ${b}. How many does she have left?`, ans:a, wq:`${a+b}-${b}`},
    ];
    const sc = scenarios[Math.floor(Math.random()*scenarios.length)];
    question=sc.q; answer=sc.ans; wolframQ=sc.wq;
    hint='Read carefully and choose the right operation!';
  }

  // Try to get Wolfram to verify / provide step-by-step
  let steps = [];
  const wfResult = await wolframQuery(wolframQ);
  if(wfResult && wfResult.steps) steps = wfResult.steps;

  return { question, answer, hint, grade, topic, wolframQ, steps };
}

async function agentCheckWfAnswer() {
  const prob = agentState.genProblem;
  if(!prob) return;
  const inp = document.getElementById('wf-user-ans');
  const val = parseFloat(inp?.value);
  if(isNaN(val)) return;

  const fb = document.getElementById('wf-feedback');
  const stepDiv = document.getElementById('wf-step-solution');
  if(!fb || !stepDiv) return;

  fb.style.display='flex';
  const isKo = currentLang === 'ko';

  const isCorrect = Math.abs(val - prob.answer) < 0.01;
  if(isCorrect) {
    fb.className='math-feedback correct';
    fb.innerHTML = isKo ? '🎉 정답이에요! 잘했어요!' : '🎉 Correct! Great job!';
    launchMiniConfetti();
    state.xp+=15; state.coins+=5; updateHeader();
    stepDiv.style.display='none';
  } else {
    fb.className='math-feedback wrong';
    fb.innerHTML = isKo
      ? `❌ 틀렸어요. 정답은 <b>${prob.answer}</b>이에요. 왜 그런지 알아볼까요?`
      : `❌ Not quite. The answer is <b>${prob.answer}</b>. Let's see why:`;

    stepDiv.style.display='block';
    const loadingMsg = isKo ? 'Claude AI가 풀이를 설명하는 중…' : 'Claude AI is explaining the solution…';
    stepDiv.innerHTML=`<div class="wolfram-result-title">📐 ${isKo?'풀이 설명':'Step-by-step solution'}</div><div class="wolfram-result-step">${loadingMsg}</div>`;

    // Try Claude AI explanation first
    const explainPrompt = isKo
      ? `수학 문제: "${prob.question}" 정답은 ${prob.answer}입니다. 초등학생이 이해할 수 있게 한국어로 풀이 과정을 단계별로 설명해 주세요.`
      : `Math problem: "${prob.question}" The answer is ${prob.answer}. Explain the solution step by step for an elementary school kid.`;

    const claudeExplain = await callClaudeAPI([{role:'user', content: explainPrompt}]);

    if(claudeExplain) {
      stepDiv.innerHTML=`<div class="wolfram-result-title">📐 ${isKo?'Claude AI 풀이':'Claude AI Solution'}</div>
        <div class="wolfram-result-step">${claudeTextToHTML(claudeExplain)}</div>
        <div style="margin-top:8px;font-size:11px;color:#9CA3AF;">✨ Claude AI</div>`;
    } else {
      // Fallback to Wolfram
      const wfFull = await wolframQuery(prob.wolframQ, true);
      if(wfFull && wfFull.steps && wfFull.steps.length) {
        stepDiv.innerHTML=`<div class="wolfram-result-title">📐 ${isKo?'풀이':'Step-by-step solution'}</div>
          <div class="wolfram-result-step">${wfFull.steps.map(s=>`• ${escapeHTML(s)}`).join('<br>')}</div>`;
      } else {
        stepDiv.innerHTML=`<div class="wolfram-result-title">📐 ${isKo?'풀이':'Solution'}</div>
          <div class="wolfram-result-step">${escapeHTML(prob.question)}<br><b>${isKo?'정답':'Answer'}: ${prob.answer}</b><br>${escapeHTML(prob.hint||'')}</div>`;
      }
    }
  }
}

async function agentEnglishSend() {
  const inp = document.getElementById('english-input');
  const q = inp?.value.trim();
  if(!q) return;

  const box = document.getElementById('english-result-box');
  if(!box) return;
  const loadingMsg = currentLang==='ko' ? 'Claude AI가 검색 중…' : 'Claude AI is looking up…';
  box.innerHTML=`<div class="wolfram-result show"><div class="wolfram-result-title">🔍 ${loadingMsg}</div><div class="wolfram-result-step"><span class="math-spinner" style="border-top-color:#6366F1;"></span></div></div>`;

  // Build a prompt for Claude
  const prompt = currentLang==='ko'
    ? `다음 영어 관련 질문에 어린이가 이해할 수 있도록 한국어로 설명해 주세요: "${q}". 철자, 정의, 동의어, 반의어, 문법 등 질문에 맞게 답해 주세요.`
    : `Answer this English language question for a kid: "${q}". If it's about spelling, show each letter. If definition, give a simple kid-friendly explanation with an example sentence.`;

  let html = '';
  const claudeResp = await callClaudeAPI([{role:'user', content: prompt}]);

  if(claudeResp) {
    html=`<div class="wolfram-result show">
      <div class="wolfram-result-title">📖 "${escapeHTML(q)}"</div>
      <div class="wolfram-result-body">${claudeTextToHTML(claudeResp)}</div>
      <div style="margin-top:8px;font-size:11px;color:#9CA3AF;">✨ Claude AI</div>
    </div>`;
  } else {
    // Fallback to Wolfram
    const result = await wolframQuery(q);
    if(result && result.answer) {
      html=`<div class="wolfram-result show">
        <div class="wolfram-result-title">📖 "${escapeHTML(q)}"</div>
        <div class="wolfram-result-body">${escapeHTML(result.answer)}</div>
        ${result.steps ? `<div class="wolfram-result-step">${result.steps.map(s=>escapeHTML(s)).join('<br>')}</div>` : ''}
      </div>`;
    } else {
      html = `<div class="wolfram-result show">
        <div class="wolfram-result-title">📖 Result</div>
        <div class="wolfram-result-body">${localEnglishAnswer(q)}</div>
      </div>`;
    }
  }
  box.innerHTML=html;
  state.xp+=5; updateHeader();
}

function localEnglishAnswer(q) {
  const ql=q.toLowerCase();
  if(ql.startsWith('spell')) {
    const w=q.replace(/spell\s*:?\s*/i,'').trim();
    return `The word <b>"${escapeHTML(w)}"</b> is spelled: <code>${escapeHTML(w.toLowerCase())}</code><br>
      Letters: <code>${w.toLowerCase().split('').join(' - ')}</code>`;
  }
  if(ql.startsWith('define') || ql.startsWith('what does')) {
    const w=q.replace(/define\s*:?\s*|what does\s*/i,'').replace(/\s*mean.*/i,'').trim();
    return `Wolfram|Alpha couldn't be reached. Try: <b>"define ${escapeHTML(w)}"</b> when online, or check a dictionary! 📚`;
  }
  if(ql.includes('synonym')) {
    const w=q.replace(/synonym\s*of\s*/i,'').trim();
    return `Looking for synonyms of <b>"${escapeHTML(w)}"</b> — requires Wolfram|Alpha connection. Try again in a moment! 🔄`;
  }
  if(ql.includes('antonym')) {
    const w=q.replace(/antonym\s*of\s*/i,'').trim();
    return `Looking for antonyms of <b>"${escapeHTML(w)}"</b> — requires Wolfram|Alpha connection. Try again in a moment! 🔄`;
  }
  return `I searched for <b>"${escapeHTML(q)}"</b>. Wolfram|Alpha is offline right now. Try again in a moment! 🔄`;
}

async function agentGrammarCheck() {
  const inp = document.getElementById('grammar-input');
  const q = inp?.value.trim();
  if(!q) return;

  const box = document.getElementById('grammar-result-box');
  if(!box) return;
  const loadingMsg = currentLang==='ko' ? 'Claude AI가 문법을 검사 중…' : 'Claude AI is checking grammar…';
  box.innerHTML=`<div class="wolfram-result show"><div class="wolfram-result-step"><span class="math-spinner" style="border-top-color:#F97316;"></span> ${loadingMsg}</div></div>`;

  const prompt = currentLang==='ko'
    ? `다음 영어 문장의 문법을 검사하고 한국어로 설명해 주세요: "${q}". 틀린 부분이 있으면 올바른 형태를 보여주고 이유를 설명해 주세요. 맞으면 잘 썼다고 칭찬해 주세요.`
    : `Check the grammar of this sentence for a kid: "${q}". Point out any errors, show the corrected version, and explain why in simple terms. If it's correct, say so with encouragement!`;

  let html = '';
  const claudeResp = await callClaudeAPI([{role:'user', content: prompt}]);

  if(claudeResp) {
    html=`<div class="wolfram-result show">
      <div class="wolfram-result-title">${currentLang==='ko'?'✅ 문법 검사 결과':'✅ Grammar Check'}</div>
      <div class="wolfram-result-body">${claudeTextToHTML(claudeResp)}</div>
      <div style="margin-top:8px;font-size:11px;color:#9CA3AF;">✨ Claude AI</div>
    </div>`;
  } else {
    html=`<div class="wolfram-result show">
      <div class="wolfram-result-title">✅ Grammar Check (Local)</div>
      <div class="wolfram-result-body">${localGrammarCheck(q)}</div>
    </div>`;
  }
  box.innerHTML=html;
}

function localGrammarCheck(sentence) {
  const rules=[
    [/\b(she|he|it)\s+go\b/i,'Subject-verb agreement: use <b>"goes"</b> instead of "go" after she/he/it'],
    [/\b(i)\s+am\b/i,null],// correct, skip
    [/\ba\s+[aeiou]/i,'Article: use <b>"an"</b> before vowel sounds (a, e, i, o, u)'],
    [/\bthey\s+is\b/i,'Subject-verb agreement: use <b>"are"</b> instead of "is" after "they"'],
    [/\bwe\s+was\b/i,'Subject-verb agreement: use <b>"were"</b> instead of "was" after "we"'],
    [/\bi\s+has\b/i,'Subject-verb agreement: use <b>"have"</b> instead of "has" after "I"'],
  ];
  const issues=[];
  for(const [pat,msg] of rules){
    if(msg && pat.test(sentence)) issues.push(msg);
  }
  if(!issues.length) return `✅ "<i>${escapeHTML(sentence)}</i>" — looks good! (Full check needs Wolfram|Alpha online)`;
  return `⚠️ Found ${issues.length} issue(s):<br>`+issues.map(i=>`• ${i}`).join('<br>');
}

function escapeHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
